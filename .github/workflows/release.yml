name: Test and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests
      - run: python -m build
      - name: Check distribution and release version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib, zipfile
          from media_bot import __version__
          root = pathlib.Path('.')
          assert tomllib.loads((root/'pyproject.toml').read_text())['project']['version'] == __version__
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__
          with zipfile.ZipFile(next((root/'dist').glob('*.whl'))) as wheel:
              expected = {
                  source.relative_to(package.parent).as_posix()
                  for package in (root/'media_bot', root/'services/takaneko/takaneko_telegram')
                  for source in package.rglob('*.py')
              }
              expected.add('media_bot/admin/console.css')
              expected.add('media_bot/admin/fanclub_export.txt')
              missing = expected.difference(wheel.namelist())
              assert not missing, f'Modules missing from the wheel: {sorted(missing)}'
          PY
      - name: Install bot and Takaneko provider on a clean Linux host
        if: matrix.python == '3.11'
        run: bash .github/tests/standalone-install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.python == '3.11'
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "Install the attached wheel or source distribution. See the README for configuration and service commands."
