[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-social-downloader"
version = "1.2.0.dev1"
description = "Telegram media downloads, subscription delivery and web administration"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
telegram-social-downloader = "media_bot.__main__:main"

[tool.setuptools]
license-files = ["INSTAGRAM-WEB-NOTICE.txt"]
package-dir = {takaneko_telegram = "services/takaneko/takaneko_telegram"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = [".", "services/takaneko"]
include = ["media_bot", "media_bot.*", "takaneko_telegram", "takaneko_telegram.*"]
namespaces = false

[tool.setuptools.package-data]
"media_bot.admin" = ["console.css"]
